# docker-compose.yml — Lakehouse local (MinIO + Postgres/JDBC-catalog + Iceberg REST + Trino + Spark + CloudBeaver)
#
# Kiến trúc catalog: KHÔNG SQLite. Metadata catalog production = PostgreSQL, truy cập qua
# 1 REST catalog server (iceberg-rest, dùng org.apache.iceberg.jdbc.JdbcCatalog nối Postgres) —
# Trino và Spark cùng nối vào REST catalog này (1 nguồn sự thật duy nhất cho metadata + snapshot).
#
# Secrets: 100% đọc từ `.env` (gitignored). KHÔNG default credential nào hardcode ở đây.
# Trước khi `docker compose up`: `cp .env.example .env` rồi điền giá trị thật (dev-local OK).
#
# Version pin: minio/mc theo RELEASE tag, postgres:16-alpine, trino:470 (Iceberg connector JDBC-catalog
# type ổn định từ Trino >=406), tabulario/iceberg-rest:1.6.0 (bundle sẵn driver Postgres 42.7.4),
# apache/spark:3.5.9-python3, dbeaver/cloudbeaver:26.1.4.
#
# RAM: VM Docker Desktop cần tối thiểu ~7-8GB (đã test thật trên máy dev: Docker Desktop báo
# "Total Memory: 7.75GiB" — tổng mem_limit các service ~6.75GB, còn ~1GB đệm cho daemon).
# Lưu ý perf đã verify thật: MERGE ON dùng "=" (không phải IS NOT DISTINCT FROM) — bench cho
# thấy IS NOT DISTINCT FROM ép Trino nested-loop join (O(n^2), >3 phút/121930 dòng); đổi "="
# xong ~2-4s. Trino mem_limit bump 2g->3g lúc debug (không phải nguyên nhân chính, giữ lại vì
# margin an toàn hơn cho MERGE nhiều bảng lớn).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: datathon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing in .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: datathon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER missing in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

  mc:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: datathon-mc-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER missing in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET missing in .env}
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./infra/minio/init.sh:/init/init.sh:ro
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: datathon-iceberg-rest
    depends_on:
      postgres:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    environment:
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER:?POSTGRES_USER missing in .env}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?ICEBERG_WAREHOUSE missing in .env}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER missing in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      REST_PORT: 8181
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8181' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

  trino:
    image: trinodb/trino:470
    container_name: datathon-trino
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER missing in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?ICEBERG_WAREHOUSE missing in .env}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 3g
    cpus: 2
    logging: *default-logging
    restart: unless-stopped

  spark-iceberg:
    image: apache/spark:3.5.9-python3
    container_name: datathon-spark-iceberg
    user: root
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      HOME: /tmp/spark-home
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER missing in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?ICEBERG_WAREHOUSE missing in .env}
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./jobs:/opt/jobs:ro
      - ./data:/opt/data:ro
      - spark_ivy_cache:/tmp/spark-home/.ivy2
    healthcheck:
      test: ["CMD", "/opt/spark/bin/spark-submit", "--version"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 20s
    mem_limit: 1536m
    cpus: 2
    logging: *default-logging
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.1.4
    container_name: datathon-cloudbeaver
    depends_on:
      trino:
        condition: service_healthy
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8978' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 384m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  cloudbeaver_data:
  spark_ivy_cache:
