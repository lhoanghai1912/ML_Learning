# infra/trino/etc/config.properties — single-node Trino, sized cho VM Docker nhỏ (mem_limit 3g).
# Override default image config.properties (default có ${ENV:CATALOG_MANAGEMENT} chưa set -> fail boot).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# Memory: JVM heap 2560MB (-Xmx, xem jvm.config; mem_limit container = 3g).
# Đặt dưới heap để tránh OOM kill. Bump từ 1000MB (2g container) sau khi verify thật: MERGE
# UPDATE-heavy trên bảng ~120k dòng bị GC-thrash/chậm (>1 phút) ở heap 1.5GB — 2.5GB đủ mượt
# (xem .process_status/M2.md phần perf).
query.max-memory=1500MB
query.max-memory-per-node=1500MB
