# infra/trino/etc/catalog/iceberg.properties — Iceberg connector, catalog type REST
# (REST catalog backend = PostgreSQL JDBC catalog, xem infra/iceberg/README.md).
# Version pin: theo image trinodb/trino:470 (docker-compose.yml) — connector Iceberg bundle sẵn
# trong image này, hỗ trợ iceberg.catalog.type=rest + fs.native-s3 (ổn định từ Trino >=440).
#
# Credential: 0 hardcode. ${ENV:VAR} đọc từ process env container (compose truyền từ .env).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}
iceberg.file-format=PARQUET
iceberg.register-table-procedure.enabled=true
# 14 bảng raw trải 2012-2022 (~132 tháng) -> MERGE full-history 1 lần chạm nhiều partition
# month(date) cùng lúc. Default 100 writer/query không đủ -> bump (dữ liệu demo, không phải
# streaming nhỏ giọt nên chấp nhận mở nhiều writer 1 lần).
iceberg.max-partitions-per-writer=500

# S3 (MinIO) — native S3 filesystem support của Trino (thay hive.s3.* cũ, đúng khuyến nghị
# cho Trino >=430+).
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
