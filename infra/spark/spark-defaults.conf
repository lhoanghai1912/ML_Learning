# infra/spark/spark-defaults.conf — Spark + Iceberg runtime + S3A, dùng chung REST catalog
# với Trino (1 nguồn sự thật metadata: Postgres JDBC catalog qua iceberg-rest).
#
# Jars resolve qua Maven (spark.jars.packages) lúc spark-submit start — cache tại
# /tmp/spark-home/.ivy2 (volume spark_ivy_cache, xem docker-compose.yml) để lần chạy sau nhanh hơn.
# Credential S3: KHÔNG đặt ở đây — đọc qua AWS SDK default credential chain từ env
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (compose truyền từ .env, xem service spark-iceberg).

spark.jars.packages                    org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.4
spark.jars.ivy                         /tmp/spark-home/.ivy2

spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.iceberg.uri          http://iceberg-rest:8181
spark.sql.catalog.iceberg.io-impl      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint  http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.defaultCatalog               iceberg

spark.hadoop.fs.s3a.endpoint           http://minio:9000
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.impl               org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider

spark.driver.memory                    1g
spark.executor.memory                  1g
spark.master                           local[*]
