[project]
name = "datathon"
version = "0.1.0"
description = "Vin Datathon 2026 — lakehouse (Spark + Iceberg + Trino + MinIO + dbt) forecast & analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Team Datathon 2026" },
]
dependencies = [
    "pandas",
    "matplotlib",
    "openpyxl",
    "lunardate",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "xgboost",
    "lightgbm",
    "nbconvert",
    "nbclient",
    "notebook",
    "dbt-trino==1.10.3",
    "dbt-core==1.10.22",
    "pyiceberg",
    "boto3",
    "psycopg2-binary",
    "trino",
    "structlog",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
obs = [
    "openlineage-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datathon"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
